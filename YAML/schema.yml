---
version: "1.0"

nodes:
  - name: Platform
    namespace: Topology
    description: The operating system running on the device
    attributes:
      - name: name
        kind: Text
        unique: true

  - name: Role
    namespace: Topology
    description: The functional role of the device
    attributes:
      - name: name
        kind: Text
        unique: true

  - name: Device
    namespace: Topology
    description: A network router or switch
    attributes:
      - name: name
        kind: Text
        unique: true
      # gNMI reachability — the address/port gNMIc dials for telemetry.
      # Stored as data so it can change in one place and flow through the system.
      - name: gnmi_address
        kind: IPHost
        description: IP or hostname gNMIc connects to for this device
        optional: true
      - name: gnmi_port
        kind: Number
        description: TCP port for the gNMI subscription
        optional: true
    relationships:
      - name: platform
        peer: TopologyPlatform
        cardinality: one
        kind: Attribute
      - name: role
        peer: TopologyRole
        cardinality: one
        kind: Attribute
      - name: interfaces
        peer: TopologyInterface
        cardinality: many
        kind: Component
        identifier: "device__interface"

  - name: Interface
    namespace: Topology
    description: A physical port on the device
    attributes:
      - name: name
        kind: Text
    relationships:
      - name: device
        peer: TopologyDevice
        cardinality: one
        kind: Parent
        optional: false
        identifier: "device__interface"
      - name: connected_endpoint
        peer: TopologyInterface
        cardinality: one
        optional: true
        kind: Attribute
        direction: outbound
    uniqueness_constraints:
      - ["device", "name__value"]