apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: observability-config
  namespace: flux-system
spec:
  interval: 1m
  url: http://gitea-http.gitea.svc.cluster.local:3000/admin/REPO_NAME_PLACEHOLDER.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-sync
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: observability-config
  path: ./
  prune: true